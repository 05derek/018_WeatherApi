<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Lokasi - Praktikum 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pencari Data Lokasi</h1>
        <p>Masukkan nama tempat untuk mendapatkan detail lokasi dari MapTiler API.</p>
        <div class="input-group">
            <input type="text" id="input-lokasi" placeholder="Contoh: Yogyakarta, Jakarta..." />
            <button onclick="cariLokasi()">Cari Lokasi</button>
        </div>

        <div class="result-card" id="result-card" style="display: none;">
            <h2>Hasil Pencarian</h2>
            <ul>
                <li><strong>Negara:</strong> <span id="res-negara">-</span></li>
                <li><strong>Provinsi:</strong> <span id="res-provinsi">-</span></li>
                <li><strong>Kecamatan/Kota:</strong> <span id="res-kecamatan">-</span></li>
                <li><strong>Longitude:</strong> <span id="res-lon">-</span></li>
                <li><strong>Latitude:</strong> <span id="res-lat">-</span></li>
            </ul>
        </div>
        <div id="error-message" class="error"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
